spring:
  application:
    name: backend

  datasource:
    # Supabase session pooler — see backend.md §2.3
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      # Supabase free tier caps pooler CLIENTS at 15 for the whole project.
      # Local (5) + Render (DB_POOL_MAX=8) must stay under 15 together.
      maximum-pool-size: ${DB_POOL_MAX:5}
      minimum-idle: 2

  jpa:
    # Schema is owned by Flyway — Hibernate must never create or alter it.
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Kolkata

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          # Supabase Auth token issuer. The project URL is public information,
          # so it is safe to default here; override via SUPABASE_ISSUER if the
          # project ever moves. Only true secrets live in env vars.
          issuer-uri: ${SUPABASE_ISSUER:https://ttqosjbjnpeioioiovsp.supabase.co/auth/v1}

app:
  cors:
    # Comma-separated list of allowed frontend origins
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    # Legacy HS256 fallback — set SUPABASE_JWT_SECRET only if issuer-uri is empty
    secret: ${SUPABASE_JWT_SECRET:}
  seed:
    # dev-profile seeder target (a Supabase auth.users UUID). Only used when
    # the app runs with SPRING_PROFILES_ACTIVE=dev — see DevSeedRunner.
    user-id: ${SEED_USER_ID:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.hibernate.SQL: info
server:
  port: ${PORT:8080}
